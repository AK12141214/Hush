name: Build Hush Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hush
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Configure Android linker
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p .cargo

          echo "CC_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          cat > .cargo/config.toml <<EOF2
          [target.aarch64-linux-android]
          linker = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          ar = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          echo "CC_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          EOF2

      - name: Build Hush native library
        working-directory: native/weya_nc_build/weya_nc
        run: |
          cargo build \
            --release \
            --target aarch64-linux-android

      - name: Verify library
        run: |
          ls -lh native/weya_nc_build/weya_nc/target/aarch64-linux-android/release/libweya_nc.so
          file native/weya_nc_build/weya_nc/target/aarch64-linux-android/release/libweya_nc.so

      - name: Prepare artifact
        run: |
          mkdir -p output/arm64-v8a
          cp native/weya_nc_build/weya_nc/target/aarch64-linux-android/release/libweya_nc.so \
             output/arm64-v8a/libweya_nc.so

      - name: Upload Android ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: hush-libweya_nc-android-arm64
          path: output/arm64-v8a/libweya_nc.so
